name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Verify build
        run: |
          if [ -f go.mod ]; then go build ./... && go test ./... -count=1; fi

      - name: Generate changelog
        run: bash scripts/changelog-gen.sh > CHANGELOG_UNRELEASED.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_UNRELEASED.md
          draft: false

      - name: Push to Gitee
        run: |
          git remote add gitee https://gitee.com/shing1211/ibkrapi4go.git
          git push gitee main --tags
