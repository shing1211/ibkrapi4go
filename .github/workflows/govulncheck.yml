name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run govulncheck
        run: |
          if [ -f go.mod ]; then
            go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          else
            echo "no go.mod yet; skipping"
          fi
