name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Check for Go module
        id: hasmod
        run: echo "present=$([ -f go.mod ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Check conventional commits
        if: github.event_name == 'pull_request'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|ci|chore|build)(\(.+\))?!?: ]]; then
            echo "PR title does not follow conventional commits: $PR_TITLE"
            echo "Expected: feat(scope): description"
            exit 1
          fi

      - name: Format check
        if: steps.hasmod.outputs.present == 'yes'
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^client/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        if: steps.hasmod.outputs.present == 'yes'
        run: go vet ./...

      - name: Test (race)
        if: steps.hasmod.outputs.present == 'yes'
        run: go test ./... -race -count=1

      - name: Run tests with coverage
        if: steps.hasmod.outputs.present == 'yes'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to codecov
        if: steps.hasmod.outputs.present == 'yes'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Verify go.sum integrity
        if: steps.hasmod.outputs.present == 'yes'
        run: go mod verify

      - name: Skip notice
        if: steps.hasmod.outputs.present == 'no'
        run: echo "No go.mod yet; public SDK not implemented. Skipping build/test."

  docs:
    name: docs guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check markdown links
        run: python3 scripts/check_links.py

      - name: Check README translations
        run: python3 scripts/check_i18n.py

  codegen:
    name: codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      - name: Verify generated code is reproducible
        run: make codegen-verify

  benchmarks:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Check for Go module
        id: hasmod
        run: echo "present=$([ -f go.mod ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks
        if: steps.hasmod.outputs.present == 'yes'
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=1s -json ./pkg/ibkr/... ./internal/... > $RUNNER_TEMP/bench_current.json

      - name: Compare against baseline
        if: steps.hasmod.outputs.present == 'yes'
        run: |
          go run scripts/bench_compare.go $RUNNER_TEMP/bench_current.json benchmark.baseline

      - name: Skip notice
        if: steps.hasmod.outputs.present == 'no'
        run: echo "No go.mod yet; public SDK not implemented. Skipping benchmarks."
