name: release-automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver tag: $TAG"
            exit 1
          fi

      - name: Generate changelog
        run: bash scripts/changelog-gen.sh > CHANGELOG_UNRELEASED.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_UNRELEASED.md
          draft: false
          prerelease: false

      - name: Push to Gitee
        run: |
          git remote add gitee https://gitee.com/shing1211/ibkrapi4go.git
          git push gitee main --tags
