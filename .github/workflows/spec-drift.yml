name: spec-drift

on:
  schedule:
    - cron: "0 9 * * 1" # weekly on Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  spec-version-check:
    name: upstream spec drift watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run spec version check
        id: check
        run: |
          output=$(python3 scripts/check_spec_version.py 2>&1)
          echo "$output"
          exit_code=${?}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if echo "$output" | grep -q "Live version:"; then
            live_version=$(echo "$output" | grep "Live version:" | awk '{print $NF}')
            echo "live_version=$live_version" >> "$GITHUB_OUTPUT"
          fi
          if echo "$output" | grep -q "Pinned version:"; then
            pinned_version=$(echo "$output" | grep "Pinned version:" | awk '{print $NF}')
            echo "pinned_version=$pinned_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issue on drift
        if: steps.check.outputs.exit_code == '1'
        run: |
          gh issue create \
            --title "[spec-drift] Upstream IBKR spec advanced to ${{ steps.check.outputs.live_version }}" \
            --body "## Spec Drift Detected

The live IBKR OpenAPI spec has advanced beyond the pinned version.

- **Pinned version:** ${{ steps.check.outputs.pinned_version }}
- **Live version:** ${{ steps.check.outputs.live_version }}
- **Detected by:** spec-drift workflow

Action required:
1. Fetch the new spec: \`make codegen\`
2. Review the diff for breaking changes or new operations
3. Update \`scripts/patch_spec.py\` if needed
4. Regenerate: \`make codegen\`
5. Verify: \`make codegen-verify && make check\`
6. Commit and tag a new release

---
_This issue was automatically created by the spec-drift workflow._" \
            --label "spec-drift" \
            --label "upstream-change"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on script error
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "::error::Spec version check script encountered an error. Check workflow logs for details."
          exit 1

      - name: Log no-drift result
        if: steps.check.outputs.exit_code == '0'
        run: echo "Spec up-to-date at v${{ steps.check.outputs.live_version }}"
