#
# golangci-lint configuration. Run: golangci-lint run
#
# Note: the rule that client/*.gen.go must only be imported from pkg/ibkr and
# internal/ is enforced by review (see docs/design/04-generated-wrapping.md),
# not by a linter, to avoid false positives in tests.

version: 2

run:
  timeout: 5m
  tests: true
  go: "1.26"

linters:
  enable:
    - errcheck
    - revive
    - staticcheck
    - unused
    - ineffassign
    - copyloopvar
    - gosec
    - misspell
    - bodyclose
    - contextcheck
    - errorlint
    - nolintlint
    - unconvert

linters-settings:
  revive:
    rules:
      - name: exported
        severity: error
        arguments:
          - ignorePackageSuffixes:
              - "_test"
  gosec:
    excludes:
      - G104

issues:
  exclude-dirs:
    - client
    - contrib
  exclude-use-fatal: true
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
