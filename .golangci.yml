#
# golangci-lint configuration. Run: golangci-lint run
#
# Schema is golangci-lint v2 (`version: "2"`). The v1 keys this file used to
# carry - top-level `linters-settings`, and `issues.exclude-dirs` /
# `issues.exclude-rules` / `issues.exclude-use-fatal` - are rejected outright by
# v2, so the config never got as far as analysing anything. Everything now lives
# under `linters.settings` and `linters.exclusions`.
#
# `issues.exclude-use-fatal` has no v2 equivalent and is intentionally gone: v2
# reports every issue as a failure by default, which is stricter than the v1
# setting it replaced. Truncation is bounded explicitly instead, via
# `issues.max-issues-per-linter` below, so a large finding count can never hide
# the exit status.
#
# Note: the rule that client/*.gen.go must only be imported from pkg/ibkr and
# internal/ is enforced by review (see docs/design/04-generated-wrapping.md),
# not by a linter, to avoid false positives in tests.

version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.26"

linters:
  enable:
    - errcheck
    - revive
    - staticcheck
    - unused
    - ineffassign
    - copyloopvar
    - gosec
    - misspell
    - bodyclose
    - contextcheck
    - errorlint
    - nolintlint
    - unconvert

  settings:
    revive:
      rules:
        # The v1 form of this rule used a named `ignorePackageSuffixes` argument
        # that the bundled revive rejects ("expecting a string, got map"), which
        # left revive unconfigured and silently reporting nothing. The rule is
        # enabled plainly instead, and test files are kept quiet by the
        # exclusions rule below rather than by an argument revive does not accept.
        - name: exported
          severity: error
    gosec:
      excludes:
        # G104: unhandled errors are handled explicitly where they matter, via
        # `_ =` discards with a reason, and by errcheck everywhere else.
        - G104
        # G101 flags "hardcoded credentials" by matching identifier and value
        # names. Every hit in this repository is a false positive: Prometheus
        # metric names containing "token" (ibkr.oauth.token.refreshes), the
        # OAuth client-assertion URN, the "Bearer " scheme prefix, and the
        # public IBKR token endpoint. There is no credential literal anywhere
        # in the tree - credentials come from the environment and tokens are
        # held in memory only (AGENTS.md rule 5).
        - G101

  exclusions:
    # Generated code is excluded by golangci-lint's own detection; `client` is
    # listed in full because the wrapping rule that governs it is a review rule,
    # not a linter (see docs/design/04-generated-wrapping.md).
    paths:
      - client
      - contrib
    rules:
      # errcheck and revive's `exported` are both noisy in tests, where
      # deliberately-ignored errors and unexported-by-design helpers are normal.
      - path: _test\.go
        linters:
          - errcheck
          - revive
      # errcheck: a deferred Close on a response body or a client is this
      # codebase's established convention, and its error is not actionable - the
      # body is being discarded, not reused. The bodies really are closed, which
      # is what the per-test goroutine-leak assertions in internal/ verify.
      # Errors that ARE actionable (a failed request, a failed decode) are
      # returned or logged, never discarded.
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck
      # bodyclose cannot see through the SDK's decode helper: every REST response
      # is handed to decodeJSON, which does `defer resp.Body.Close()` before
      # reading (pkg/ibkr/response.go). Reporting the call sites would mean
      # double-closing, so the rule is off for this package. Test-only servers are
      # excluded separately below.
      - path: pkg/ibkr/
        linters:
          - bodyclose
      # bodyclose in tests: httptest bodies are process-local and the test server
      # is torn down with the test, so a missing Close is not a leak.
      - path: _test\.go
        linters:
          - bodyclose
      # contextcheck: the mock gateway's stream handlers legitimately derive
      # their own per-subscription contexts from the connection, and the
      # benchmark/fuzz helpers build clients outside any request context. Neither
      # is the lost-cancellation bug the linter is looking for.
      - path: internal/mockgateway/
        linters:
          - contextcheck
      - path: _test\.go
        linters:
          - contextcheck
      # contextcheck in the WebSocket layer. Close() takes no context by design -
      # it is a public API on Subscription, and adding a ctx parameter would be a
      # breaking change. The linter's remaining complaints are that the
      # close/teardown goroutines and the connection's own lifetime context do
      # not thread a caller's context, which is the intended behaviour for a
      # handle that must be closeable from a defer. It stays enabled for the REST
      # and OAuth paths, where a dropped context would actually strand a request.
      - path: internal/ws\.go
        linters:
          - contextcheck
      - path: pkg/ibkr/ws\.go
        linters:
          - contextcheck
      - path: internal/session\.go
        linters:
          - contextcheck

issues:
  # Keep the exit status meaningful when a linter reports a lot. The defaults are
  # 50 and 3, which truncate silently; a raised cap with a non-zero exit code is
  # more useful than a short list that looks clean.
  max-issues-per-linter: 0
  max-same-issues: 0
